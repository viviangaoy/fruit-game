<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抓大鹅 · 水果消消乐</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 22px 14px 36px;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #38234f;
        background: linear-gradient(135deg, #f7d9ff 0%, #d9e7ff 48%, #ffe2ec 100%);
    }

    .game {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 22px;
        border: 1px solid rgba(255,255,255,.75);
        border-radius: 28px;
        background: rgba(255,255,255,.72);
        box-shadow: 0 18px 50px rgba(82, 48, 119, .18);
        backdrop-filter: blur(8px);
    }

    h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(28px, 6vw, 42px);
        letter-spacing: 2px;
    }

    .subtitle {
        margin: 8px 0 18px;
        text-align: center;
        color: #765c91;
        font-size: 14px;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .counter {
        padding: 9px 14px;
        border-radius: 999px;
        background: #f0e4ff;
        font-weight: 700;
    }

    .restart {
        border: 0;
        border-radius: 999px;
        padding: 10px 17px;
        color: white;
        background: linear-gradient(135deg, #8e5de7, #bd62cb);
        box-shadow: 0 5px 0 #7545b9;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .restart:active { transform: translateY(2px); box-shadow: 0 3px 0 #7545b9; }

    .message {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 9px 12px;
        margin: 10px 0 14px;
        border-radius: 14px;
        background: rgba(255,255,255,.8);
        color: #6d4289;
        text-align: center;
        font-weight: 600;
    }

    .items {
        position: relative;
        display: block;
        width: 100%;
        height: 350px;
        margin: 0 auto 20px;
        overflow: visible;
        isolation: isolate;
        border: 2px dashed rgba(156, 112, 194, .25);
        border-radius: 22px;
        background: rgba(247, 239, 255, .55);
    }

    /* 水果：只显示水果图案，不显示卡片 */
.item {
    position: absolute;

    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    /* 去掉卡片背景和边框 */
    background: transparent;
background-color: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    outline: none;

    /* 水果大小 */
    font-size: 0;
   // line-height: 1;

    /* 保留点击功能和上下层遮挡 */
    padding: 0;
    margin: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;

    /* 不规则水果不需要卡片轮廓 */
    overflow: visible;

    transition: transform 0.15s ease;
}

/* 鼠标放上去时，水果轻轻放大 */
.item:hover {
    transform: scale(1.12);
    background: transparent;
    border: none;
    box-shadow: none;
}

/* 点击时轻微缩放 */
.item:active {
    transform: scale(0.92);
}

/* 键盘操作时保留清晰的焦点提示 */
.item:focus-visible {
    outline: 2px dashed #ff9800;
    outline-offset: 2px;
}

    .item:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); }
    .item:focus-visible { outline: 3px solid #8e5de7; outline-offset: 2px; }
    .item:disabled { cursor: default; }
    .item.is-blocked { filter: saturate(.65) brightness(.92); }

    .tray-title {
        margin: 0 0 9px;
        font-weight: 800;
        text-align: center;
    }

    .slots {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 7px;
        padding: 11px;
        border-radius: 18px;
        background: #e9dcfa;
        box-shadow: inset 0 3px 8px rgba(87, 49, 119, .1);
    }

    .slot {
        display: flex;
        align-items: center;
        justify-content: center;
 min-width: 0;
        height: 58px;
        border: 2px dashed #c5a9e3;
        border-radius: 13px;
        background: rgba(255,255,255,.68);
        font-size: clamp(22px, 4.4vw, 32px);
    }

/* 收集槽里的水果图片 */
.slot-fruit-image {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
    margin: auto;
    pointer-events: none;
}


    .slot.filled {
        border-style: solid;
        border-color: white;
        background: white;
        box-shadow: 0 3px 8px rgba(85, 52, 110, .1);
    }

    .rules {
        margin: 15px 0 0;
        color: #765c91;
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
    }

    .celebration-layer {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
    }

    .celebration-text {
        padding: 18px 25px;
        border: 2px solid rgba(255,255,255,.9);
        border-radius: 24px;
        color: #fff;
        background: linear-gradient(135deg, #a56af0, #f17bb8);
        box-shadow: 0 12px 35px rgba(91, 42, 130, .3);
        font-size: clamp(25px, 6vw, 42px);
        font-weight: 900;
        text-shadow: 0 2px 3px rgba(80, 35, 110, .2);
        animation: pop-in .45s ease both, float-away 1.5s ease .45s both;
    }

    .sparkle {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 24px;
        animation: sparkle-fly 1.4s ease-out forwards;
    }

    @keyframes pop-in {
        from { transform: scale(.45) rotate(-8deg); opacity: 0; }
        to { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes float-away {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-35px) scale(1.04); opacity: 0; }
    }

    @keyframes sparkle-fly {
        from { transform: translate(-50%, -50%) scale(.4) rotate(0); opacity: 1; }
        to {
            transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(180deg);
            opacity: 0;
        }
    }

    @media (max-width: 520px) {
        body { padding: 12px 8px 24px; }
        .game { padding: 15px 10px; border-radius: 22px; }
        .items { height: 350px; }
        .item { height: 64px; border-radius: 14px; }
        .slots { gap: 4px; padding: 7px; }
        .slot { height: 49px; border-radius: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    /* 失败提示：覆盖在收集槽中央 */
/* 失败提示：显示在水果堆叠区域正中央 */
.failure-overlay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 85%;
    max-width: 360px;
    box-sizing: border-box;
    padding: 20px 12px;

    background: rgba(55, 25, 30, 0.94);
    border: 3px solid #ff7676;
    border-radius: 18px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);

    text-align: center;
    color: white;

    z-index: 99999;
    animation: failurePop 0.35s ease-out;

    /* 防止遮挡重新开始按钮 */
    pointer-events: none;
}

.failure-title {
    font-size: 27px;
    font-weight: 900;
    color: #ff8585;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    margin-bottom: 8px;
}

.failure-subtitle {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.failure-tip {
    font-size: 13px;
    color: #ffe0d0;
}

@keyframes failurePop {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.65);
    }
    75% {
        transform: translate(-50%, -50%) scale(1.06);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}
.timer {
    font-size: 30px;
    font-weight: bold;
    color: #e53935;
    text-align: center;
    margin: 10px 0;
    font-variant-numeric: tabular-nums;
}
.preview-title {
    text-align: center;
    font-weight: bold;
    margin: 12px 0;
    color: #765c91;
}

#fruit3d-preview {
    width: 100%;
    height: 340px;
    margin-bottom: 20px;
    overflow: hidden;
    border-radius: 22px;
    background: linear-gradient(145deg, #30284b, #665078);
}

#fruit3d-preview canvas {
    display: block;
    width: 100%;
    height: 100%;
}

        0 0 35px rgba(90, 50, 255, 0.35),

}

/* 主标题 */
.game-title {

/* 玩法说明 */
.subtitle {

/* 顶部横向信息栏 */
.topbar {

    padding: 13px;

        0 0 22px rgba(150, 60, 255, 0.5),

}

/* 收集槽和水果数量 */
.counter,
.fruit-stats {
    padding: 10px 12px;
    border: 1px solid rgba(80, 220, 255, 0.65);
    border-radius: 12px;
    background: rgba(0, 15, 65, 0.65);
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;

}

.fruit-stats {

    gap: 8px;
}

.stat-divider {

}

/* 倒计时 */
.timer {
    margin: 0;

    background: rgba(0, 15, 65, 0.65);

}

/* 重新开始 */
.restart {
    padding: 12px 17px;

    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, #7045ff, #c42bdf);
    box-shadow:
        0 0 8px #ed4dff,
        0 0 16px rgba(190, 50, 255, 0.5);
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    cursor: pointer;
}

/* 音乐图标按钮 */
.music-toggle {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border: 2px solid #19eaff;
    border-radius: 50%;
    color: white;
    background: linear-gradient(135deg, #0755c9, #5925c9);
    box-shadow:
        0 0 10px #00dfff,
        inset 0 0 10px rgba(255,255,255,0.2);
    font-size: 24px;
    cursor: pointer;
}

.music-toggle:active,
.restart:active {
    transform: scale(0.94);
}

/* 手机屏幕适配 */
@media (max-width: 650px) {
    .game {
        padding: 16px 9px;
    }

    .topbar {
        flex-wrap: wrap;
        justify-content: center;
        gap: 7px;
        padding: 9px 6px;
    }

    .counter,
    .fruit-stats {
        padding: 8px;
        font-size: 12px;
    }

    .timer {
        padding: 8px;
        font-size: 19px;
    }

    .restart {
        padding: 10px 12px;
        font-size: 12px;
    }

    .music-toggle {
        width: 44px;
        height: 44px;
    }
}
/* ===== 顶部界面第二版优化 ===== */

/* 游戏标题：简洁科技感 */
.game-title {
    margin: 8px 0 24px;
    padding: 5px 0;

    text-align: center;
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        sans-serif;

    font-size: clamp(38px, 6vw, 56px);
    font-weight: 1000;
    letter-spacing: 8px;

    color: #ffffff;
    background: linear-gradient(
        180deg,
        #ffffff 5%,
        #b8f5ff 45%,
        #48caff 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 3px #ffffff)
        drop-shadow(0 0 9px #00cfff)
        drop-shadow(0 0 20px #286bff);
}

/* 顶部五个区域均匀填满 */
.topbar {
    display: grid;

    grid-template-columns:
        0.9fr
        0.9fr
        1.7fr
        1.2fr
        0.55fr;

    align-items: center;
    justify-content: stretch;
    gap: 10px;

    width: 100%;
    padding: 13px;
}

/* 每个信息区域都允许自适应 */
.topbar > * {
    min-width: 0;
    width: 100%;
    margin: 0;
    text-align: center;
}

/* 收集槽 */
.topbar .counter {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px 5px;
    font-size: 16px;
}

/* 倒计时 */
.topbar .timer {
    padding: 12px 5px;
    font-size: 25px;
}

/* 水果总数和剩余数量 */
.topbar .fruit-stats {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    padding: 12px 5px;
    font-size: 15px;
}

/* 重新开始按钮 */
.topbar .restart {
    width: 100%;
    padding: 13px 5px;
    font-size: 15px;
}

/* 音乐按钮保持圆形，不拉伸 */
.topbar .music-toggle {
    width: 54px;
    height: 54px;
    justify-self: center;
    padding: 0;
}

/* 手机屏幕适配 */
@media (max-width: 650px) {

    .game-title {
        font-size: 36px;
        letter-spacing: 4px;
        margin-bottom: 18px;
    }

    .topbar {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .topbar .fruit-stats {
        grid-column: span 2;
    }

    .topbar .counter,
    .topbar .timer {
        font-size: 17px;
    }

    .topbar .restart {
        font-size: 13px;
    }

    .topbar .music-toggle {
        width: 46px;
        height: 46px;
    }
}

/* ===== 顶部信息栏第四版：强制单行 ===== */

.topbar {
    display: grid !important;

    /* 固定五列，任何宽度都不换行 */
    grid-template-columns:
        minmax(0, 0.85fr)
        minmax(0, 0.85fr)
        minmax(0, 1.65fr)
        minmax(0, 1fr)
        48px !important;

    grid-template-rows: 56px !important;
    grid-auto-flow: column !important;

    align-items: center;
    justify-content: stretch;
    gap: 6px;

    width: 100%;
    padding: 9px;
    overflow: hidden;
}

/* 所有信息框统一尺寸 */
.topbar > * {
    grid-row: 1 !important;

    box-sizing: border-box;
    min-width: 0 !important;
    width: 100% !important;
    height: 52px !important;
    margin: 0 !important;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

}

.topbar .music-toggle {

<body>
<main class="game">
   <h1 class="game-title">水果抓抓乐</h1>

<div class="topbar">

    <div class="counter">
        🧺 <span id="count">0</span> /
        <span id="slot-capacity"></span>
    </div>

    <div id="timer" class="timer">05:00</div>

    <div class="fruit-stats">
        <span>🍎 总数：<span id="total-fruits">60</span></span>
        <span class="stat-divider">|</span>
        <span>剩余：<span id="remaining-fruits">60</span></span>

    <button class="restart" id="restart" type="button"

</button>

    <button
        class="music-toggle"
        id="music-toggle"
        type="button"

    >🔇</button>

</div>


    <div class="message" id="message" role="status" aria-live="polite">

    </div>

    <p class="tray-title">🧺 收集槽</p>

// 欢快的水果消除游戏原创旋律
const bgmMelody = [
    784, 988, 1175, 988,
    880, 1047, 1319, 1047,

// 播放一个音符
function playBgmNote(frequency, duration, volume, type) {
    const now = bgmAudioContext.currentTime;

    const oscillator = bgmAudioContext.createOscillator();
    const gain = bgmAudioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(
        volume, now + 0.025
    );
    gain.gain.exponentialRampToValueAtTime(
        0.001, now + duration
    );

    oscillator.connect(gain);
    gain.connect(bgmMasterGain);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.02);
}


function playBackgroundStep() {
    if (!bgmAudioContext || !bgmMasterGain) return;

    const index = bgmNoteIndex % bgmMelody.length;

    // 主旋律：清脆、跳跃的电子音
    playBgmNote(
        bgmMelody[index],
        0.20,
        0.11,
        "triangle"
    );

    // 和弦伴奏：让音乐更丰满
    const chords = [
        [523.25, 659.25, 783.99],
        [440.00, 554.37, 659.25],
        [392.00, 493.88, 587.33],
        [440.00, 554.37, 659.25]
    ];

    if (index % 4 === 0) {
        const chord = chords[
            Math.floor(index / 4) % chords.length
        ];

        chord.forEach(function(note) {
            playBgmNote(note, 0.45, 0.025, "sine");
        });
    }

    // 低音节拍
    if (index % 4 === 0) {
        const bassNotes = [
            130.81, 110.00, 98.00, 110.00
        ];

        playBgmNote(
            bassNotes[Math.floor(index / 4) % 4],
            0.35,
            0.10,
            "triangle"
        );
    }

    // 每隔两拍增加一个清脆的高音点缀
    if (index % 2 === 1) {
        playBgmNote(
            bgmMelody[index] * 2,
            0.09,
            0.025,
            "sine"
        );
    }

    bgmNoteIndex++;
}


// 启动背景音乐
function startBackgroundMusic() {
    if (!bgmEnabled || bgmTimer !== null) return;

        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        console.warn("当前浏览器不支持 Web Audio API");
        return;
    }

    if (!bgmAudioContext) {
        bgmAudioContext = new AudioContextClass();

        bgmMasterGain = bgmAudioContext.createGain();
        bgmMasterGain.gain.value = 0;

        bgmMasterGain.connect(bgmAudioContext.destination);
    }

    bgmAudioContext.resume().then(function() {
        if (!bgmEnabled || bgmTimer === null) return;

        bgmMasterGain.gain.setTargetAtTime(
            0.65,
            bgmAudioContext.currentTime,
            0.15
        );

        playBackgroundStep();
    });

    bgmTimer = setInterval(function() {
        if (bgmAudioContext.state === "running") {
            playBackgroundStep();
        }
    }, 240);
}

// 暂停背景音乐
function stopBackgroundMusic() {
    if (bgmTimer !== null) {
        clearInterval(bgmTimer);
        bgmTimer = null;
    }

    if (bgmAudioContext && bgmMasterGain) {
        bgmMasterGain.gain.setTargetAtTime(

    }
}

function playFailureSound() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        alert("当前浏览器不支持音效");
        return;
    }

    const audioContext = new AudioContextClass();

    audioContext.resume().then(function() {
        // 模拟玻璃碎裂的噪声
        const bufferSize = audioContext.sampleRate * 0.5;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }

        const noise = audioContext.createBufferSource();
        noise.buffer = buffer;

        const filter = audioContext.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 1200;

        const volume = audioContext.createGain();
        volume.gain.setValueAtTime(0.5, audioContext.currentTime);
        volume.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);

        noise.connect(filter);
        filter.connect(volume);
        volume.connect(audioContext.destination);

        noise.start();
        noise.stop(audioContext.currentTime + 0.5);

        // 加入几声清脆的玻璃高频声
        [1800, 2600, 3400].forEach(function(freq, index) {
            const oscillator = audioContext.createOscillator();
            const toneVolume = audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = freq;

            toneVolume.gain.setValueAtTime(0.12, audioContext.currentTime + index * 0.08);
            toneVolume.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + index * 0.08 + 0.2
            );

            oscillator.connect(toneVolume);
            toneVolume.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime + index * 0.08);
            oscillator.stop(audioContext.currentTime + index * 0.08 + 0.2);
        });
    });
}

// 三消成功：欢快的碰撞音效
function celebrate(fruit) {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        const audio = new AudioContextClass();

        // 播放一个短促、有弹性的碰撞声
        function playTone(frequency, startTime, duration, volume) {
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();

            oscillator.type = "triangle";

            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                frequency * 0.65,
                startTime + duration
            );

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.linearRampToValueAtTime(
                volume,
                startTime + 0.008
            );
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                startTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audio.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        const now = audio.currentTime;

        // 三下轻快的水果碰撞声
        playTone(520, now, 0.12, 0.22);
        playTone(760, now + 0.07, 0.13, 0.20);
        playTone(1050, now + 0.14, 0.20, 0.18);

        // 最后补一个清脆的高音
        playTone(1350, now + 0.23, 0.16, 0.12);

        setTimeout(function() {
            audio.close();
        }, 800);

    } catch (error) {
        console.log("音效播放失败：", error);
    }
}

function init3DPreview() {
    const container = document.getElementById("fruit3d-preview");

    if (!container || !window.THREE || !window.CANNON) {
        console.error("3D 引擎加载失败，请检查网络连接。");
        return;
    }

    // ===== 1. 创建 Three.js 场景 =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x463653);

    // GLB / GLTF 模型加载器
    const gltfLoader = new THREE.GLTFLoader();

    // ===== 90度正上方俯视 =====

    const camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        100
    );

    camera.up.set(0, 0, -1);

    // 水果越多，镜头稍微拉远
    const cameraHeight =
        10 + Math.sqrt(GAME_CONFIG.totalFruits) * 0.35;

    camera.position.set(0, cameraHeight, 0);
    camera.lookAt(0, 0, 0);

camera.updateProjectionMatrix();

    // 防止相机朝向出现不稳定的旋转
    camera.up.set(0, 0, -1);
    camera.updateProjectionMatrix();

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.shadowMap.enabled = true;
    container.innerHTML = "";
    container.appendChild(renderer.domElement);

    // 灯光
    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x57405f,
            1.7
        )
    );

    const light = new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

    light.position.set(-5, 10, 7);
    scene.add(light);

    // ===== 2. 创建物理世界 =====
    const world = new CANNON.World();

    world.gravity.set(0, -16, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 12;

    // 水果和地板使用不同的物理材质
    const fruitMaterial = new CANNON.Material("fruitMaterial");
    const floorMaterial = new CANNON.Material("floorMaterial");

    // 水果之间的碰撞：有摩擦，弹性适中
    world.addContactMaterial(
        new CANNON.ContactMaterial(
            fruitMaterial,
            fruitMaterial,
            {
                friction: 0.55,
                restitution: 0.12
            }
        )
    );

    // 水果与地板之间的碰撞：摩擦更明显，减少滑动
    world.addContactMaterial(
        new CANNON.ContactMaterial(
            fruitMaterial,
            floorMaterial,
            {
                friction: 0.7,
                restitution: 0.08
            }
        )
    );


    // ===== 3. 创建圆形水果容器 =====

    // 场地参数
    const containerRadius = 3.2;
    const containerHeight = 24;
    const wallSegments = 160;
    const wallThickness = 0.4;

    // ===== 圆形暗色哑光地板 =====

    const floorGeometry = new THREE.CylinderGeometry(
        containerRadius,
        containerRadius,
        0.25,
        96
    );

    const floorMaterialVisual = new THREE.MeshStandardMaterial({
        color: 0x25202b,
        roughness: 1.0,
        metalness: 0.0
    });

    const floor = new THREE.Mesh(
        floorGeometry,
        floorMaterialVisual
    );

    floor.position.y = -0.125;
    floor.receiveShadow = true;
    scene.add(floor);

    // Cannon.js 水平物理地面
    const floorBody = new CANNON.Body({
        mass: 0,
        material: floorMaterial,
        shape: new CANNON.Plane()
    });

    floorBody.position.set(0, 0, 0);
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);

    world.addBody(floorBody);


    // ===== 4. 创建透明圆柱筒壁 =====

    // 可见的透明筒壁
    const wallGeometry = new THREE.CylinderGeometry(
        containerRadius,
        containerRadius,
        containerHeight,
        wallSegments,
        1,
        true
    );

    const transparentWallMaterial = new THREE.MeshStandardMaterial({
        color: 0xb9d9e8,
        roughness: 1.0,
        metalness: 0.0,
        transparent: true,
        opacity: 0.13,
        side: THREE.DoubleSide,
        depthWrite: false
    });

    const wallMesh = new THREE.Mesh(
        wallGeometry,
        transparentWallMaterial
    );

    wallMesh.position.y = containerHeight / 2;
    scene.add(wallMesh);


    // ===== 5. 创建圆形物理围墙 =====

    for (let i = 0; i < wallSegments; i++) {
        const angle = i / wallSegments * Math.PI * 2;

        const wallBody = new CANNON.Body({
            mass: 0,
            material: floorMaterial,
            shape: new CANNON.Box(
                new CANNON.Vec3(
                    wallThickness / 2,
                    containerHeight / 2,
                    containerRadius * Math.PI / wallSegments * 1.1
                )
            )
        });

        wallBody.position.set(
            Math.cos(angle) * containerRadius,

    async function createFruit(type) {
        const config = fruitConfigs[type];

        let mesh;

        // 如果配置了 GLB 模型路径，就尝试加载真实模型
        if (config.modelPath) {

            try {
                const gltf = await new Promise(function(resolve, reject) {
                    gltfLoader.load(
                        config.modelPath,
                        resolve,
                        undefined,
                        reject
                    );
                });

                // 获取 GLB 模型
                mesh = gltf.scene;

                // 自动计算模型原始尺寸
                const box = new THREE.Box3().setFromObject(mesh);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // 获取模型最长的一条边
                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                if (maxDimension <= 0) {
                    throw new Error("模型尺寸无效");
                }

                // 自动校准模型大小
                const targetSize = 0.86 * config.size;
                const scale = targetSize / maxDimension;

                mesh.scale.setScalar(scale);

                // 将模型中心移动到原点
                mesh.position.set(
                    -center.x * scale,
                    -center.y * scale,
                    -center.z * scale
                );

                // 保存模型来源信息
                mesh.userData.modelSource = "GLB";

            } catch (error) {

                console.warn(
                    "水果模型加载失败，使用程序模型代替：",
                    config.name,
                    error
                );

                mesh = makeFruit(type);
            }

        } else {

            // 没有配置模型路径时，使用程序生成模型
            mesh = makeFruit(type);
        }

        // 保存水果类型和配置信息
        mesh.userData.fruitType = type;
        mesh.userData.fruitConfig = config;

        // 创建对应的物理刚体
        const body = createFruitPhysics(type);

        return {
            type: type,
            mesh: mesh,
            body: body
        };
    }

    // 随机生成水果种类，保证每种水果数量都是3的倍数
    function generateFruitTypes(totalCount) {
        if (
            !Number.isInteger(totalCount) ||
            totalCount < 24 ||
            totalCount % 3 !== 0
        ) {
            throw new Error("水果总数必须是大于或等于24的3的倍数！");
        }
        const fruitTypeCount = 8;
        const groupCount = totalCount / 3;

        // 每种水果先分配一组三个
        const groups = Array(fruitTypeCount).fill(1);

        // 剩余的三水果组合随机分配
        for (let i = fruitTypeCount; i < groupCount; i++) {
            const randomType = Math.floor(Math.random() * fruitTypeCount);
            groups[randomType]++;
        }

        // 根据分配数量生成水果列表
        const fruitTypes = [];

        groups.forEach(function(group, type) {
            for (let i = 0; i < group * 3; i++) {
                fruitTypes.push(type);
            }
        });

        // 打乱水果出现顺序
        for (let i = fruitTypes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fruitTypes[i], fruitTypes[j]] = [fruitTypes[j], fruitTypes[i]];
        }

        return fruitTypes;
    }

    console.log("越界水果数量：", outsideFruits.length);

    console.log(
        insideFruits.length === GAME_CONFIG.totalFruits
            ? "检测结果：全部水果都在容器内！"
            : "检测结果：容器内水果数量不正确！"
    );

    if (outsideFruits.length > 0) {
        console.warn("以下水果疑似越界：");
        console.table(outsideFruits);
    }

    console.log("====================================");

    // ===== 解锁消除 =====

    canCollectFruits = true;

    message.textContent = "水果已落稳，可以开始消除了！";

    console.log("水果堆高度稳定，允许开始消除！");

    setTimeout(function() {

        if (canCollectFruits && !gameOver) {
            message.textContent = "";
        }

    }, 1800);
}
    }
}

        // 根据水果堆高度计算目标镜头高度
        const targetCameraHeight = Math.max(
            CAMERA_CONFIG.minHeight,
            Math.min(
                CAMERA_CONFIG.maxHeight,
                highestFruit + CAMERA_CONFIG.topPadding
            )
        );

        const cameraDelta = frameDelta;

        const smoothFactor = 1 - Math.exp(
            -CAMERA_CONFIG.followSpeed * cameraDelta
        );

        currentCameraHeight +=
            (targetCameraHeight - currentCameraHeight) *
            smoothFactor;

        // 始终保持90度垂直俯视
        camera.position.set(
            0,
            currentCameraHeight,
            0
        );

        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // 窗口尺寸变化
    window.addEventListener("resize", function() {
        const width = container.clientWidth;
        const height = container.clientHeight;

        if (!width || !height) return;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
    });
}


// 初始化 3D 场景
init3DPreview();

// 绑定重新开始按钮
restartButton.addEventListener("click", restartGame);

// 初始化收集槽和倒计时
updateSlots();
startTimer();

// ===== 背景音乐开关 =====

const musicToggleButton =
    document.getElementById("music-toggle");

if (musicToggleButton) {
    musicToggleButton.textContent = "🔇";
}

if (musicToggleButton) {
    musicToggleButton.addEventListener("click", function(event) {
        event.stopPropagation();

        bgmEnabled = !bgmEnabled;

        if (bgmEnabled) {
            musicToggleButton.textContent = "🎵";
            startBackgroundMusic();
        } else {
            musicToggleButton.textContent = "🔇";
            stopBackgroundMusic();
        }
    });
}

// 第一次点击游戏区域时启动音乐
document.querySelector(".game").addEventListener(
    "pointerdown",
    function(event) {
        if (event.target.closest("#music-toggle")) return;

        if (bgmEnabled && !gameOver) {
            startBackgroundMusic();
        }
    }
);

</script>
