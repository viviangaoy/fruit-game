<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抓大鹅 · 水果消消乐</title>
<style>

/* ========================================
   水果抓抓乐 - 马卡龙水果花园主题
   统一整理版
======================================== */

/* ===== 1. 全局与网页背景 ===== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 22px 14px 36px;

    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #704b3b;

    background-image: url("images/fruit-garden-bg.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #bde9ff;
}

/* ===== 2. 游戏主卡片：奶油磨砂玻璃 ===== */

.game {
    width: min(1000px, 100%);
    margin: 0 auto;
    padding: 22px 18px;

    background: rgba(255, 248, 235, 0.28);

    backdrop-filter: blur(18px) saturate(135%);
    -webkit-backdrop-filter: blur(18px) saturate(135%);

    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 28px;

    box-shadow:
        0 12px 35px rgba(160, 110, 75, 0.13),
        inset 0 2px 15px rgba(255, 255, 255, 0.75);
}

/* ===== 3. 游戏标题 ===== */

h1,
.game-title {
    margin: 8px 0 24px;
    padding: 5px 0;

    text-align: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;

    font-size: clamp(34px, 6vw, 52px);
    font-weight: 1000;
    letter-spacing: 5px;

    background: linear-gradient(
    135deg,
    rgba(255, 241, 220, 0.20) 0%,
    rgba(255, 190, 195, 0.18) 50%,
    rgba(252, 232, 216, 0.22) 100%

    
);

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 3px 2px rgba(180, 112, 75, 0.16));

        /* 强制恢复标题的蜜桃橙色 */
    color: #F0784F !important;
    background: none !important;
    -webkit-text-fill-color: #F0784F !important;

    text-shadow:
        0 3px 5px rgba(180, 100, 65, 0.20);
}

.subtitle {
    margin: 8px 0 18px;
    text-align: center;
    color: #a47a65;
    font-size: 14px;
}

/* ===== 4. 顶部信息栏 ===== */

.topbar {
    display: grid;

    grid-template-columns:
        minmax(0, 0.85fr)
        minmax(0, 0.85fr)
        minmax(0, 1.65fr)
        minmax(0, 1fr)
        48px;

    grid-template-rows: 56px;
    grid-auto-flow: column;

    align-items: center;
    justify-content: stretch;

    gap: 9px;
    width: 100%;
    padding: 10px 4px;
    margin-bottom: 14px;
}

.topbar > * {
    box-sizing: border-box;
    min-width: 0;
    width: 100%;
    height: 52px;
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid rgba(255, 255, 255, 0.95);
    border-radius: 17px;

    box-shadow: 0 4px 0 rgba(160, 115, 75, 0.13);

    font-weight: 800;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-shadow: none;
}

/* 收集数量：蜜桃粉 */

.topbar .counter {
    grid-column: 1;
    padding: 0 3px;

    background: linear-gradient(145deg, #ffe4d7, #ffcbb9);
    color: #98563f;
    font-size: 15px;
}

/* 倒计时：奶油黄 */

.topbar .timer {
    grid-column: 2;
    padding: 0 3px;

    background: linear-gradient(145deg, #fff2b9, #ffdf83);
    color: #a45c2f;

    font-size: 23px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

/* 水果统计：薄荷绿 */

.topbar .fruit-stats {
    grid-column: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    padding: 0 3px;

    background: linear-gradient(145deg, #e1f7df, #bfe9c3);
    color: #477b50;
    font-size: 14px;
}

.stat-divider {
    color: #8dbb8d;
}

/* 重新开始：草莓粉 */

.topbar .restart {
    grid-column: 4;

    padding: 0 4px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg, #ff9caa, #f47791);
    border: 2px solid white;
    border-radius: 16px;

    color: white;
    box-shadow: 0 5px 0 #d85e78;

    font-size: 14px;
    font-weight: 900;
    cursor: pointer;

    transition: transform 0.15s ease, filter 0.15s ease;
}

.topbar .restart:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.topbar .restart:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #d85e78;
}

/* 音乐按钮：天空蓝 */

.topbar .music-toggle {
    grid-column: 5;

    width: 46px;
    height: 46px;
    padding: 0;

    justify-self: center;

    background: linear-gradient(145deg, #8edbfa, #54b9e9);
    border: 3px solid white;
    border-radius: 50%;

    color: white;
    box-shadow: 0 5px 0 #3998c8;

    font-size: 22px;
    cursor: pointer;
}

.topbar .music-toggle:active {
    transform: scale(0.92);
}

/* ===== 5. 提示信息 ===== */

.message {
    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 9px 12px;
    margin: 10px 0 14px;

    background: rgba(255, 244, 217, 0.88);
    border: 2px solid white;
    border-radius: 16px;

    color: #a16b4b;
    text-align: center;
    font-weight: 600;

    box-shadow: 0 3px 10px rgba(170, 130, 90, 0.08);
}

/* ===== 6. 3D 水果区域：蜜桃磨砂玻璃 ===== */


/* ===== 轻透蜜桃粉 3D 区域 ===== */
#fruit3d-preview {
    width: 100%;
    height: 340px;
    margin-bottom: 20px;
    overflow: hidden;
    border-radius: 22px;

    /* 只叠加淡粉色，不再增加第二层磨砂 */
    background: linear-gradient(
        135deg,
        rgba(255, 239, 222, 0.14) 0%,
        rgba(255, 190, 205, 0.12) 50%,
        rgba(255, 228, 215, 0.16) 100%
    );

    /* 不重复模糊外层背景 */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;

    border: 2px solid rgba(255, 255, 255, 0.82);

    box-shadow:
        inset 0 2px 10px rgba(255, 255, 255, 0.30),
        0 5px 15px rgba(190, 130, 100, 0.10);
}

#fruit3d-preview canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent !important;
}


.preview-title {
    text-align: center;
    font-weight: bold;
    margin: 12px 0;
    color: #a47a65;
}

/* ===== 7. 水果区域（保留原有功能样式） ===== */

.items {
    position: relative;
    display: block;

    width: 100%;
    height: 350px;
    margin: 0 auto 20px;

    overflow: visible;
    isolation: isolate;

    border: 2px dashed rgba(156, 112, 194, 0.25);
    border-radius: 22px;
    background: rgba(247, 239, 255, 0.55);
}

.item {
    position: absolute;

    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    outline: none;

    padding: 0;
    margin: 0;

    font-size: 0;

    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;

    overflow: visible;
    transition: transform 0.15s ease;
}

.item:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.03);
}

.item:active {
    transform: scale(0.92);
}

.item:focus-visible {
    outline: 2px dashed #ff9800;
    outline-offset: 2px;
}

.item:disabled {
    cursor: default;
}

.item.is-blocked {
    filter: saturate(0.65) brightness(0.92);
}

/* ===== 8. 收集槽 ===== */

.tray-title {
    margin: 0 0 9px;
    font-weight: 800;
    text-align: center;
}

.slots {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));

    gap: 7px;
    padding: 11px;

    border-radius: 18px;
    background: #e9dcfa;

    box-shadow: inset 0 3px 8px rgba(87, 49, 119, 0.1);
}

.slot {
    display: flex;
    align-items: center;
    justify-content: center;

    min-width: 0;
    height: 58px;

    border: 2px dashed #c5a9e3;
    border-radius: 13px;

    background: rgba(255, 255, 255, 0.68);
    font-size: clamp(22px, 4.4vw, 32px);
}

.slot-fruit-image {
    width: 38px;
    height: 38px;

    object-fit: contain;
    display: block;
    margin: auto;

    pointer-events: none;
}

.slot.filled {
    border-style: solid;
    border-color: white;
    background: white;

    box-shadow: 0 3px 8px rgba(85, 52, 110, 0.1);
}

/* ===== 9. 游戏说明 ===== */

.rules {
    margin: 15px 0 0;
    color: #947caa;

    font-size: 13px;
    line-height: 1.7;
    text-align: center;
}

/* ===== 10. 消除庆祝动画 ===== */

.celebration-layer {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    pointer-events: none;
}

.celebration-text {
    padding: 18px 25px;

    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;

    color: white;
    background: linear-gradient(135deg, #a56af0, #f17bb8);

    box-shadow: 0 12px 35px rgba(91, 42, 130, 0.3);

    font-size: clamp(25px, 6vw, 42px);
    font-weight: 900;

    text-shadow: 0 2px 3px rgba(80, 35, 110, 0.2);

    animation:
        pop-in 0.45s ease both,
        float-away 1.5s ease 0.45s both;
}

.sparkle {
    position: absolute;
    top: 50%;
    left: 50%;

    font-size: 24px;
    animation: sparkle-fly 1.4s ease-out forwards;
}

@keyframes pop-in {
    from {
        transform: scale(0.45) rotate(-8deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes float-away {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-35px) scale(1.04);
        opacity: 0;
    }
}

@keyframes sparkle-fly {
    from {
        transform: translate(-50%, -50%) scale(0.4) rotate(0);
        opacity: 1;
    }
    to {
        transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(180deg);
        opacity: 0;
    }
}

/* ===== 11. 失败提示 ===== */

.failure-overlay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 85%;
    max-width: 360px;
    box-sizing: border-box;

    padding: 20px 12px;

    background: rgba(55, 25, 30, 0.94);
    border: 3px solid #ff7676;
    border-radius: 18px;

    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);

    text-align: center;
    color: white;

    z-index: 99999;
    animation: failurePop 0.35s ease-out;

    pointer-events: none;
}

.failure-title {
    font-size: 27px;
    font-weight: 900;
    color: #ff8585;

    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    margin-bottom: 8px;
}

.failure-subtitle {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.failure-tip {
    font-size: 13px;
    color: #ffe0d0;
}

@keyframes failurePop {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.65);
    }
    75% {
        transform: translate(-50%, -50%) scale(1.06);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}


/* =================================
   手机端：宽屏利用型游戏状态栏
   ================================= */

@media (max-width: 650px) {

   .topbar {
    display: grid !important;

    grid-template-columns:
        0.85fr
        1.25fr
        1.65fr
        42px
        42px !important;

    grid-template-rows: 46px !important;
    grid-auto-flow: column;

    gap: 5px !important;
    width: 100% !important;
    padding: 8px 2px !important;
    margin-bottom: 14px;

    align-items: center;
}

    /* 所有控件统一高度 */
    .counter,
    .timer,
    .fruit-stats,
    .restart,
    .music-toggle {
        box-sizing: border-box !important;

        width: 100% !important;
        min-width: 0 !important;
        height: 46px !important;
        min-height: 46px !important;

        margin: 0 !important;
        padding: 0 3px !important;

        border-radius: 15px !important;
        font-size: 13px !important;
        font-weight: 700 !important;

        white-space: nowrap;
        overflow: hidden;
    }

    /* 收集槽：0/7 */
    .counter {
        flex: none !important;
        justify-content: center;
        gap: 1px;
        font-size: 14px !important;
    }

    .counter-icon {
        display: none !important;
    }

    /* 倒计时：完整显示 04:45 */
    .timer {
        flex: none !important;
        justify-content: center;
        font-size: 15px !important;
        letter-spacing: -0.5px;
    }

    /* 水果统计：剩余：29/30 */
    .fruit-stats {
        flex: none !important;
        justify-content: center;
        gap: 2px !important;
        font-size: 12px !important;
        border-radius: 15px !important;
    }

    .fruit-stats .stat-divider,
    .fruit-stats .total-stat .stat-label {
        display: none !important;
    }

    .fruit-stats .stat-label,
    .fruit-stats .stat-slash {
        display: inline !important;
    }

    /* 重新开始：只显示图标 */
    .restart {
        flex: none !important;
        justify-content: center;
        padding: 0 !important;
    }

    .restart-text {
        display: none !important;
    }

    .restart-icon {
        display: inline !important;
        font-size: 22px !important;
    }

    /* 音乐：只显示图标 */
    .music-toggle {
        flex: none !important;
        justify-content: center;
        padding: 0 !important;
        border-radius: 50% !important;
        font-size: 20px !important;
    }
}


/* ===== 13. 极窄屏幕适配 ===== */

@media (max-width: 400px) {

    .topbar {
        grid-template-columns:
            minmax(0, 0.75fr)
            minmax(0, 0.75fr)
            minmax(0, 1.35fr)
            minmax(0, 0.45fr)
            34px;

        gap: 3px;
        padding: 4px;
    }

    .topbar .counter {
        font-size: 10px;
    }

    .topbar .timer {
        font-size: 15px;
    }

    .topbar .fruit-stats {
        font-size: 8px;
        gap: 1px;
    }

    .topbar .music-toggle {
        width: 32px;
        height: 32px;
        font-size: 16px;
    }

    .topbar .restart {
        font-size: 10px;
    }
}

/* ===== 14. 减少动态效果设置 ===== */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

   水果抓抓乐 · 3D 马卡龙果冻 UI

/* ===== 3D 水果木牌标题图片 ===== */

    margin: 0 auto 18px !important;
    padding: 0 !important;

}

    display: block;

}

/* =================================
   3D 标题悬浮布局 · 优化版
   ================================= */

/* 外层游戏卡片 */
.game {

"use strict";

// 3D 游戏重置接口

// ==================== 游戏难度配置 ====================

const GAME_CONFIG = {
    totalFruits: 30,       // 每局水果总数，必须是3的倍数
    gameTime: 5 * 60,      // 每局游戏时间，单位：秒
    slotCapacity: 7        // 收集槽容量
};


// ===== 背景音乐系统 =====

let bgmAudioContext = null;
let bgmMasterGain = null;
let bgmTimer = null;
let bgmNoteIndex = 0;
let bgmEnabled = false;

// 欢快的水果消除游戏原创旋律
const bgmMelody = [
    784, 988, 1175, 988,
    880, 1047, 1319, 1047,
    988, 1175, 1568, 1175,
    1047, 988, 880, 784,

    1047, 1319, 1568, 1319,
    1175, 1397, 1760, 1397,
    1319, 1175, 1047, 988,
    880, 988, 1047, 1175
];

// 播放一个音符
function playBgmNote(frequency, duration, volume, type) {
    const now = bgmAudioContext.currentTime;

    const oscillator = bgmAudioContext.createOscillator();
    const gain = bgmAudioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(
        volume, now + 0.025
    );
    gain.gain.exponentialRampToValueAtTime(
        0.001, now + duration
    );

    oscillator.connect(gain);
    gain.connect(bgmMasterGain);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.02);
}


function playBackgroundStep() {
    if (!bgmAudioContext || !bgmMasterGain) return;

    const index = bgmNoteIndex % bgmMelody.length;

    // 主旋律：清脆、跳跃的电子音
    playBgmNote(
        bgmMelody[index],
        0.20,
        0.11,
        "triangle"
    );

    // 和弦伴奏：让音乐更丰满
    const chords = [
        [523.25, 659.25, 783.99],
        [440.00, 554.37, 659.25],
        [392.00, 493.88, 587.33],
        [440.00, 554.37, 659.25]
    ];

    if (index % 4 === 0) {
        const chord = chords[
            Math.floor(index / 4) % chords.length
        ];

        chord.forEach(function(note) {
            playBgmNote(note, 0.45, 0.025, "sine");
        });
    }

    // 低音节拍
    if (index % 4 === 0) {
        const bassNotes = [
            130.81, 110.00, 98.00, 110.00
        ];

        playBgmNote(
            bassNotes[Math.floor(index / 4) % 4],
            0.35,
            0.10,
            "triangle"
        );
    }

    // 每隔两拍增加一个清脆的高音点缀
    if (index % 2 === 1) {
        playBgmNote(
            bgmMelody[index] * 2,
            0.09,
            0.025,
            "sine"
        );
    }

    bgmNoteIndex++;
}


// 启动背景音乐
async function startBackgroundMusic() {
    if (!bgmEnabled || bgmTimer !== null) return;

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        console.warn("当前浏览器不支持 Web Audio API");
        return;
    }

    if (!bgmAudioContext) {
        bgmAudioContext = new AudioContextClass();

        bgmMasterGain = bgmAudioContext.createGain();
        bgmMasterGain.gain.value = 0;
        bgmMasterGain.connect(bgmAudioContext.destination);
    }

    try {
        await bgmAudioContext.resume();

        if (!bgmEnabled) return;

        if (bgmAudioContext.state !== "running") {
            console.warn("音频上下文尚未运行");
            return;
        }

        bgmMasterGain.gain.setTargetAtTime(
            0.65,
            bgmAudioContext.currentTime,
            0.15
        );

        playBackgroundStep();

        bgmTimer = setInterval(function() {
            if (
                bgmEnabled &&
                bgmAudioContext.state === "running"
            ) {
                playBackgroundStep();
            }
        }, 240);

    } catch (error) {
        bgmTimer = null;
        console.warn("背景音乐启动失败：", error);
    }
}

// 暂停背景音乐
function stopBackgroundMusic() {
    if (bgmTimer !== null) {
        clearInterval(bgmTimer);
        bgmTimer = null;
    }

    if (bgmAudioContext && bgmMasterGain) {
        bgmMasterGain.gain.setTargetAtTime(
            0,
            bgmAudioContext.currentTime,
            0.08
        );
    }
}


// 当前场上剩余水果数量

// 更新七格收集槽，用水果图片显示
function updateSlots() {
    slots.innerHTML = "";

    for (let i = 0; i < GAME_CONFIG.slotCapacity; i++) {
        const slot = document.createElement("div");
        slot.className = "slot";

        if (i < collected.length) {
            const fruit = collected[i];

            // 保留水果 Emoji 作为三消标识
            slot.dataset.fruit = fruit;

            // 获取对应的透明 PNG 图片
            const imagePath = getFruitImage(fruit);

            if (imagePath) {
                const img = document.createElement("img");
                img.src = imagePath;
                img.alt = fruit;
                img.className = "slot-fruit-image";

                slot.appendChild(img);
            } else {
                // 找不到图片时，显示原来的 Emoji
                slot.textContent = fruit;
            }
        }

        slots.appendChild(slot);
    }
}

function getFruitImage(fruit) {
    const fruitImages = {
        "🍎": "images/apple.png",
        "🍌": "images/banana.png",
        "🍓": "images/strawberry.png",
        "🍇": "images/grape.png",
        "🍊": "images/orange.png",
        "🍉": "images/watermelon.png",
        "🍋": "images/lemon.png",
        "🍍": "images/pineapple.png"
    };

    return fruitImages[fruit] || "";
}

// 通用水果收集函数：2D 和 3D 水果共用
function collectFruitType(fruit) {
    if (gameOver) return;

    collected.push(fruit);

    const matching = collected.filter(function(item) {
        return item === fruit;
    });

    if (matching.length >= 3) {
        let removed = 0;

        collected = collected.filter(function(item) {
            if (item === fruit && removed < 3) {
                removed++;
                return false;
            }
            return true;
        });

        celebrate(fruit);
        message.textContent = "🎉 太棒啦！三个" + fruit + "消除成功！";
    } else {
        message.textContent = "收集到了 " + fruit + "！继续找找相同的水果吧。";
    }

    updateSlots();
    count.textContent = collected.length;

    // 七格收集槽装满，游戏失败
    if (collected.length >= GAME_CONFIG.slotCapacity) {
        gameOver = true;
        message.textContent = "";
        showFailureOverlay();
    }
}

function playFailureSound() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        alert("当前浏览器不支持音效");
        return;
    }

    const audioContext = new AudioContextClass();

    audioContext.resume().then(function() {
        // 模拟玻璃碎裂的噪声
        const bufferSize = audioContext.sampleRate * 0.5;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }

        const noise = audioContext.createBufferSource();
        noise.buffer = buffer;

        const filter = audioContext.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 1200;

        const volume = audioContext.createGain();
        volume.gain.setValueAtTime(0.5, audioContext.currentTime);
        volume.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);

        noise.connect(filter);
        filter.connect(volume);
        volume.connect(audioContext.destination);

        noise.start();
        noise.stop(audioContext.currentTime + 0.5);

        // 加入几声清脆的玻璃高频声
        [1800, 2600, 3400].forEach(function(freq, index) {
            const oscillator = audioContext.createOscillator();
            const toneVolume = audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = freq;

            toneVolume.gain.setValueAtTime(0.12, audioContext.currentTime + index * 0.08);
            toneVolume.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + index * 0.08 + 0.2
            );

            oscillator.connect(toneVolume);
            toneVolume.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime + index * 0.08);
            oscillator.stop(audioContext.currentTime + index * 0.08 + 0.2);
        });
    });
}

// 三消成功：欢快的碰撞音效
function celebrate(fruit) {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        const audio = new AudioContextClass();

        // 播放一个短促、有弹性的碰撞声
        function playTone(frequency, startTime, duration, volume) {
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();

            oscillator.type = "triangle";

            oscillator.frequency.setValueAtTime(
                frequency,
                startTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                frequency * 0.65,
                startTime + duration
            );

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.linearRampToValueAtTime(
                volume,
                startTime + 0.008
            );
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                startTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audio.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        const now = audio.currentTime;

        // 三下轻快的水果碰撞声
        playTone(520, now, 0.12, 0.22);
        playTone(760, now + 0.07, 0.13, 0.20);
        playTone(1050, now + 0.14, 0.20, 0.18);

        // 最后补一个清脆的高音
        playTone(1350, now + 0.23, 0.16, 0.12);

        setTimeout(function() {
            audio.close();
        }, 800);

    } catch (error) {
        console.log("音效播放失败：", error);
    }
}

    async function createFruit(type) {
        const config = fruitConfigs[type];

        let mesh;

        // 如果配置了 GLB 模型路径，就尝试加载真实模型
        if (config.modelPath) {

            try {
                const gltf = await new Promise(function(resolve, reject) {
                    gltfLoader.load(
                        config.modelPath,
                        resolve,
                        undefined,
                        reject
                    );
                });

                // 获取 GLB 模型
                mesh = gltf.scene;

                // 自动计算模型原始尺寸
                const box = new THREE.Box3().setFromObject(mesh);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // 获取模型最长的一条边
                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                if (maxDimension <= 0) {
                    throw new Error("模型尺寸无效");
                }

                // 自动校准模型大小
                const targetSize = 0.86 * config.size;
                const scale = targetSize / maxDimension;

                mesh.scale.setScalar(scale);

                // 将模型中心移动到原点
                mesh.position.set(
                    -center.x * scale,
                    -center.y * scale,
                    -center.z * scale
                );

                // 保存模型来源信息
                mesh.userData.modelSource = "GLB";

            } catch (error) {

                console.warn(
                    "水果模型加载失败，使用程序模型代替：",
                    config.name,
                    error
                );

                mesh = makeFruit(type);
            }

        } else {

            // 没有配置模型路径时，使用程序生成模型
            mesh = makeFruit(type);
        }

        // 保存水果类型和配置信息
        mesh.userData.fruitType = type;
        mesh.userData.fruitConfig = config;

        // 创建对应的物理刚体
        const body = createFruitPhysics(type);

        return {
            type: type,
            mesh: mesh,

        };

    // 随机生成水果种类，保证每种水果数量都是3的倍数
    function generateFruitTypes(totalCount) {
        if (
            !Number.isInteger(totalCount) ||
            totalCount < 24 ||
            totalCount % 3 !== 0
        ) {
            throw new Error("水果总数必须是大于或等于24的3的倍数！");
        }
        const fruitTypeCount = 8;
        const groupCount = totalCount / 3;

        // 每种水果先分配一组三个
        const groups = Array(fruitTypeCount).fill(1);

        // 剩余的三水果组合随机分配
        for (let i = fruitTypeCount; i < groupCount; i++) {
            const randomType = Math.floor(Math.random() * fruitTypeCount);
            groups[randomType]++;
        }

        // 根据分配数量生成水果列表
        const fruitTypes = [];

        groups.forEach(function(group, type) {
            for (let i = 0; i < group * 3; i++) {
                fruitTypes.push(type);
            }
        });

        // 打乱水果出现顺序
        for (let i = fruitTypes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fruitTypes[i], fruitTypes[j]] = [fruitTypes[j], fruitTypes[i]];
        }

        return fruitTypes;
    }

    async function create3DFruits() {

    const fruitTypes = generateFruitTypes(GAME_CONFIG.totalFruits);

    for (let i = 0; i < fruitTypes.length; i++) {
        const type = fruitTypes[i];

        // 创建水果

        // 如果已经有更新的生成任务，就停止旧任务
        if (currentGeneration !== fruitGenerationId) {
            return;
        }

        const mesh = fruit.mesh;
        const body = fruit.body;

        scene.add(mesh);

        // 每层放10个水果，共6层
        const fruitsPerLayer = 10;
        const row = Math.floor(i / fruitsPerLayer);
        const col = i % fruitsPerLayer;

        // 螺旋分布：将水果限制在圆柱内部
        const angle = col * 2.399 + row * 0.35;

        // 最大生成半径控制在 1.65，给水果碰撞体留出空间
        const radius = 2.0 * Math.sqrt((col + 0.5) / fruitsPerLayer);

        // 轻微随机偏移，避免排列过于整齐
        const randomX = (Math.random() - 0.5) * 0.06;
        const randomZ = (Math.random() - 0.5) * 0.06;

        body.position.set(
            Math.cos(angle) * radius + randomX,
            2.5 + row * 1.15 + Math.random() * 0.3,
            Math.sin(angle) * radius + randomZ
        );

        body.quaternion.setFromEuler(
            Math.random() * 0.5,
            Math.random() * Math.PI,
            Math.random() * 0.5
        );

        body.velocity.set(
            (Math.random() - 0.5) * 2.5,
            -1.5,
            (Math.random() - 0.5) * 2.5
        );

        body.angularVelocity.set(
            (Math.random() - 0.5) * 3,
            (Math.random() - 0.5) * 3,
            (Math.random() - 0.5) * 3
        );

        world.addBody(body);

        bodies.push(body);
        meshes.push(mesh);
        clickableMeshes.push(mesh);

        // 每成功生成一个水果，剩余数量加1
        remainingFruitCount++;
        updateFruitStats();
    }
